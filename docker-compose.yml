services:
  postgres:
    image: postgres:16-alpine
    container_name: novelreader-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: novelreader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novelreader"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/NovelReader.API/Dockerfile
    container_name: novelreader-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=novelreader;Username=postgres;Password=postgrespassword
      ImgBB__ApiKey: ${IMGBB_API_KEY:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-NovelReader_Super_Secret_Jwt_Signing_Key_2026_Secure_Auth!}
    ports:
      - "5092:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: novelreader-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

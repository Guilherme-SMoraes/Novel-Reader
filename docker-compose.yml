services:
  postgres:
    image: postgres:16-alpine
    container_name: novelreader-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: novelreader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novelreader"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/NovelReader.API/Dockerfile
    container_name: novelreader-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${POSTGRES_CONNECTION_STRING}
      ImgBB__ApiKey: ${IMGBB_API_KEY:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
    ports:
      - "5092:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
        - VITE_IMGBB_API_KEY=${IMGBB_API_KEY:-}
    container_name: novelreader-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
